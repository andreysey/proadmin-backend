services:
  - type: web
    name: proadmin-backend
    runtime: node
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod # This now points to dist/src/main via package.json
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: proadmin-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://proadmin-dashboard.vercel.app
      - key: PORT
        value: 3000
